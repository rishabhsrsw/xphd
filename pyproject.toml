[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xphd"
version = "1.1.0"
description = "Exciton-phonon post-processing for 2D semiconductors: symmetry, linewidths, optics and real-time transport"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rishabh Saraswat"}, {name = "Sitangshu Bhattacharya"}, {name = "Rekha Verma"}, {name = "Mantasha Ansari"}]
keywords = ["exciton", "phonon", "linewidth", "yambo", "LetzElPhC", "tetrahedron", "symmetry", "ARPES", "Boltzmann"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
generate = ["netCDF4", "tqdm"]
# commands reading yambo databases also need yambopy, installed from source
yambo = ["netCDF4"]
dev = ["pytest>=7", "matplotlib>=3.5", "scipy", "netCDF4"]
# clusters: MPI across nodes, run-time BLAS thread control, the BTE solver,
# progress bars. Build mpi4py against the cluster MPI first (docs/HPC.md).
hpc = ["mpi4py>=3.1", "threadpoolctl>=3.1", "scipy>=1.7", "tqdm"]

[project.scripts]
xphd = "xphd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
