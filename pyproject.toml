[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xphd"
version = "1.0.0"
description = "Exciton-phonon dynamics from first principles: symmetry, linewidths, real-time transport and time-resolved ARPES"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "R. Saraswat"}, {name = "S. Bhattacharya"}, {name = "R. Verma"}, {name = "M. Ansari"}]
keywords = ["exciton", "phonon", "linewidth", "yambo", "LetzElPhC", "tetrahedron", "symmetry", "ARPES", "Boltzmann"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
generate = ["netCDF4", "tqdm"]
# commands reading yambo databases also need yambopy, installed from source
yambo = ["netCDF4"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
xphd = "xphd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
